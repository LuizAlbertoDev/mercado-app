  <text x="82" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#1E293B" letter-spacing="-0.5" style="fill:rgb(30, 41, 59);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, system-ui, sans-serif;font-size:20px;font-weight:700;text-anchor:start;dominant-baseline:auto">Mercado</text>

