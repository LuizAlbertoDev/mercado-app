<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado App - Lista de Compras</title>
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/variables.css" />
    <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
    <header class="header">
        <div class="header__logo">
            <img src="../assets/img/logo.svg" alt="MercadoApp" height="48" />
        </div>

        <nav class="header__nav">
            <a href="../index.html">Dashboard</a>
            <a href="lista.html">Lista de Compras</a>
            <a href="compra.html">Realizar Compra</a>
            <a href="historico.html">Histórico de Compras</a>
        </nav>
    </header>


    <main>

        <h2>Lista de Compras</h2>
        <form id="lista-form">
                <div class="form-group">
                    <label for="item">Nome do produto</label>
                    <input type="text" id="item" name="item" placeholder="Ex: Arroz" required />
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" name="quantidade"  min="1" required />
                </div>
                <button type="submit" class="btn btn--primary">Adicionar à Lista</button>

        </form>

        <div id="lista-produtos">
            <h3>Produtos na Lista:</h3>
            <ul id="produtos-lista"></ul>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Mercado App. Criado Por Luiz Alberto Dev.</p>
    </footer>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/lista.js"></script>
</body>
</html>
